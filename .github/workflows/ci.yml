name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The repo currently tracks only pnpm-lock.yaml, so `npm ci` cannot run
      # (it requires a package-lock.json). Use plain npm install for now and
      # switch back to `npm ci` once a package-lock.json is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
